<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Attendance Issue | Helpdesk Portal</title>
    <link rel="stylesheet" href="/css/helpdesk.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <button class="back-btn" onclick="window.location.href='/helpdesk.html'">Back</button>
            <h1>Report to Admin</h1>
        </header>

        <!-- Report Form -->
        <form class="report-form">
            <label for="resident-name">Resident Name</label>
            <input type="text" id="resident-name" placeholder="Enter resident name">

            <label for="room-number">Room Number</label>
            <input type="text" id="room-number" placeholder="e.g., A-205">

            <label for="issue-period">Issue Period</label>
            <input type="date" id="issue-period">

            <label for="description">Description</label>
            <textarea id="description" placeholder="Describe the attendance issue in detail..."></textarea>

            <button type="submit" class="submit-btn">Submit Report</button>
        </form>
    </div>
</body>
</html>
