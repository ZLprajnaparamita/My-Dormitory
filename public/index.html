<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to MyDormitory</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <style>
        body {
            background-color: #f8f9fa; /* Neutral background */
        }
        .hero {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .hero h1 {
            font-size: 32px;
            font-weight: bold;
            color: #333;
        }
        .hero p {
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .hero .btn-primary {
            background-color: #b01015;
            border: none;
            font-weight: bold;
            padding: 10px 20px;
        }
        .hero .btn-primary:hover {
            background-color: #8f4b4d;
        }
    </style>
</head>
<body>
    <div class="hero">
        <!-- App Welcome Section -->
        <h1>Welcome to MyDormitory</h1>
        <p>Your dormitory attendance management system</p>

        <!-- Navigation Buttons -->
        <a href="/login" class="btn btn-primary">Login to Your Account</a>
    </div>
</body>
</html>
