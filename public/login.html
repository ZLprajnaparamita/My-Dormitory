<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | MyDormitory</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <!-- Custom CSS -->
    <style>
        body {
            background-color: #f8f9fa; /* Neutral background */
        }
        .login-card {
            width: 100%;
            max-width: 400px;
            margin: auto;
            margin-top: 50px;
            border-radius: 20px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            padding: 20px;
            background-color: #fff;
        }
        .login-logo {
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
        }
        .login-logo img {
            width: 60px;
            height: 60px;
        }
        .login-card h1 {
            font-size: 28px;
            font-weight: bold;
            color: #333;
            text-align: center; /* Centered Title */
        }
        .login-card label, .login-card h5 {
            font-weight: 500;
            text-align: left; /* Align left */
        }
        .login-card h5 {
            font-size: 22px;
            margin-top: 10px;
            margin-bottom: 5px;
        }
        .login-card .btn-primary {
            background-color: #b01015;
            border: none;
            font-weight: bold;
        }
        .login-card .btn-primary:hover {
            background-color: #8f4b4d;
        }
        .login-card .credentials {
            font-size: 14px;
            color: #666;
        }
        .login-card .credentials ul {
            padding-left: 20px;
        }
    </style>
</head>
<body>
    <!-- Login Card -->
    <div class="login-card">
        <!-- Logo Section -->
        <div class="login-logo">
            <img src="https://studentaffairs.telkomuniversity.ac.id/wp-content/uploads/2025/08/Telkom-Dorm.png" alt="Logo">
        </div>
        <h1>MyDormitory</h1>

        <!-- Login Heading -->
        <h5>Login</h5>
        <p class="text-muted">Use your dormitory account</p>

        <!-- Login Form -->
        <form action="/login" method="POST">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" name="username" id="email" class="form-control" placeholder="your.email@dorm.edu" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            <div class="mb-3 d-flex align-items-center">
                <input type="checkbox" name="remember_me" id="remember" class="form-check-input me-2">
                <label for="remember" class="form-check-label">Remember Me</label>
            </div>
            <div class="mb-3">
                <button type="submit" class="btn btn-primary w-100">Login</button>
            </div>
        </form>

        <!-- Demo Credentials -->
        <div class="credentials">
            <p>Demo credentials (<em>password: password</em>):</p>
            <ul>
                <li>resident@dorm.edu (Resident)</li>
                <li>helpdesk@dorm.edu (Helpdesk)</li>
                <li>admin@dorm.edu (Admin)</li>
            </ul>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
